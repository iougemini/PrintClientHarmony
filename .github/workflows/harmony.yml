name: 打包 HAP

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 1. 配置 JDK 17（命令行工具 26.0.0 以下版本推荐 JDK 17）
      - name: 配置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 2. 安装 devecocli（鸿蒙官方命令行构建工具，npm 全局安装）
      #    它支持 CLT（Command Line Tools）模式，Linux 上无需 DevEco Studio
      - name: 安装 devecocli
        run: |
          set -eo pipefail
          npm install -g @deveco/deveco-cli@stable
          devecocli --version

      # 3. 获取 HarmonyOS 命令行工具（内含 hvigorw / ohpm / hdc / SDK）
      #    devecocli 在 Linux 上必须用 CLT 模式（设 DEVECO_CLI_CLT_PATH 指向 CLT 目录）。
      #    CLT 目录来源（二选一，通过仓库 secret 注入）：
      #      a) DEVECO_CLI_CLT_URL —— commandline-tools zip 的公网直链（推荐）
      #         可用直链（用户已提供，已验证 URL 结构合法）：
      #           https://huggingface.co/csukuangfj/harmonyos-commandline-tools/resolve/main/commandline-tools-linux-x64-6.0.1.251.zip
      #      b) DEVECO_CLI_CLT_PATH —— 若 runner 自备 CLT 目录，直接填路径
      #    注意：华为下载中心需账号登录态，无法在 CI 匿名下载，故不提供自动下载。
      - name: 获取命令行工具
        id: clt
        run: |
          set -eo pipefail
          CLT_PATH=""
          # 路径 b：runner 自备 CLT 目录
          if [ -n "${{ secrets.DEVECO_CLI_CLT_PATH }}" ]; then
            CLT_PATH="${{ secrets.DEVECO_CLI_CLT_PATH }}"
            echo "使用自备 CLT 目录: $CLT_PATH"
          # 路径 a：从公网直链下载 zip 并解压
          elif [ -n "${{ secrets.DEVECO_CLI_CLT_URL }}" ]; then
            URL="${{ secrets.DEVECO_CLI_CLT_URL }}"
            echo "从直链下载: $URL"
            cd /opt
            sudo curl -sL "$URL" -o commandline-tools.zip
            sudo unzip -q commandline-tools.zip
            sudo rm -f commandline-tools.zip
            CLT_PATH=$(sudo find /opt -maxdepth 2 -type d -name 'command-line-tools' | head -1)
            if [ -z "$CLT_PATH" ] || [ ! -d "$CLT_PATH" ]; then
              echo "::error::解压后未找到 command-line-tools 目录"; exit 1
            fi
            echo "解压到: $CLT_PATH"
          else
            echo "::error::未配置命令行工具来源。"
            echo "请在仓库 Settings → Secrets and variables → Actions 添加以下任一 secret："
            echo "  DEVECO_CLI_CLT_URL  —— commandline-tools zip 的公网直链（推荐，上传到 GitHub Release）"
            echo "  DEVECO_CLI_CLT_PATH —— 若 runner 自备 CLT 目录，填绝对路径"
            exit 1
          fi
          # zip 不保留 Unix 权限位，解压后 node/hvigorw 等可执行文件丢失 x 位；
          # 自备目录也可能无执行权限。无论哪个来源，统一递归修复整个 CLT 目录权限。
          # 不修复会导致 "Permission denied"（exit 126）。
          sudo chmod -R 755 "$CLT_PATH"
          # 诊断：确认 node 权限状态（失败时日志可见）
          echo "=== node 权限诊断 ==="
          sudo ls -la "$CLT_PATH/tool/node/bin/" 2>/dev/null || echo "tool/node/bin 不存在"
          echo "clt-path=$CLT_PATH" >> $GITHUB_OUTPUT

      # 4. 配置 CLT 环境变量（devecocli CLT 模式用）
      #    注意：6.0.1 的 CLT 里 ohpm 不是 bin/ohpm 可执行文件，而是 ohpm/bin/pm-cli.js，
      #    必须用 CLT 内置的 node（tool/node/bin/node）运行。devecocli 源码 buildCltToolPaths 确认。
      - name: 配置 CLT 环境变量
        run: |
          set -eo pipefail
          CLT_PATH="${{ steps.clt.outputs.clt-path }}"
          # 兜底：再次递归修复权限（幂等，防止上一步 chmod 未覆盖）
          sudo chmod -R 755 "$CLT_PATH"
          echo "DEVECO_CLI_CLT_PATH=$CLT_PATH" >> $GITHUB_ENV
          echo "PATH=$CLT_PATH/bin:$PATH" >> $GITHUB_ENV
          # CLT 内置 node 与 ohpm 入口（devecocli CLT 模式路径）
          echo "CLT_NODE=$CLT_PATH/tool/node/bin/node" >> $GITHUB_ENV
          echo "CLT_OHPM=$CLT_PATH/ohpm/bin/pm-cli.js" >> $GITHUB_ENV
          # 校验 CLT：version.txt 的 apiVersion 需 >=17
          cat "$CLT_PATH/version.txt" 2>/dev/null || true
          # 验证 node 确实可执行（失败立即暴露，而不是等到 ohpm 步骤）
          echo "=== node 可执行验证 ==="
          "$CLT_PATH/tool/node/bin/node" --version || { echo "::error::CLT node 无法执行"; sudo ls -la "$CLT_PATH/tool/node/bin/"; exit 1; }
          devecocli --version

      # 5. 配置 ohpm 仓库地址（用 CLT 内置 node 执行 pm-cli.js）
      - name: 配置 ohpm 仓库
        run: |
          set -eo pipefail
          # 最终兜底：确保 CLT 目录可执行权限（幂等）
          sudo chmod -R 755 "$DEVECO_CLI_CLT_PATH"
          "$CLT_NODE" "$CLT_OHPM" config set registry https://ohpm.openharmony.cn/ohpm/
          "$CLT_NODE" "$CLT_OHPM" config set strict_ssl false

      # 6. icon 自检：确认仓库里的图标是 logo.png 生成的那一套，没有被模板覆盖
      - name: 校验图标资源
        run: |
          set -eo pipefail
          ICON=entry/src/main/resources/base/media/app_icon.png
          if [ ! -f "$ICON" ]; then
            echo "::error::缺少 $ICON（图标被删了）"; exit 1
          fi
          SIZE=$(stat -c%s "$ICON")
          echo "app_icon.png 大小: $SIZE 字节"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::app_icon.png 过小（$SIZE 字节），可能被模板图标覆盖"; exit 1
          fi
          echo "✅ 图标资源就位"

      # 7. 安装工程及模块依赖（用 CLT 内置 node 执行 pm-cli.js）
      - name: 安装依赖
        run: |
          set -eo pipefail
          sudo chmod -R 755 "$DEVECO_CLI_CLT_PATH"
          "$CLT_NODE" "$CLT_OHPM" install --all
          cd entry
          "$CLT_NODE" "$CLT_OHPM" install --all

      # 8. 编译 Debug HAP（内网自用，debug 未签名包即可，与安卓 debug APK 一致）
      - name: 编译 HAP
        run: |
          set -eo pipefail
          devecocli build --product default --build-mode debug --modules entry --clean

      # 9. 查看产物
      - name: 查看产物
        run: ls -lh entry/build/default/outputs/default/

      # 10. 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: PrintClient-Harmony-debug
          path: entry/build/default/outputs/default/*.hap
          retention-days: 30
